name: ambutrack_web
description: Gestion ambulancias
publish_to: 'none'

version: 1.0.0+1

environment:
  # Flutter 3.35.3 usa Dart 3.9.2
  sdk: '>=3.9.2 <4.0.0'
  flutter: '>=3.35.3'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Supabase (reemplaza Firebase)
  supabase_flutter: ^2.18.3

  # State Management
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  equatable: ^2.1.0
  dartz: ^0.10.1

  # UI/Design
  flutter_svg: ^2.4.0
  google_fonts: ^6.3.3

  # DI and Routing
  get_it: ^9.3.0
  injectable: ^3.0.0
  go_router: ^14.8.1

  # Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Network
  internet_connection_checker: ^3.0.1
  http: ^1.6.0

  # Utilities
  uuid: ^4.6.0
  intl: ^0.20.3
  file_picker: ^8.3.7
  table_calendar: ^3.3.0
  shared_preferences: ^2.5.6

  # PDF
  pdf: ^3.12.0
  printing: ^5.14.3

  # Maps (para visualización de fichajes con GPS)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Core Datasource (paquete local del proyecto)
  # ===== CORE SHARED PACKAGE (Monorepo) =====
  # ambutrack_core:  # ← DEPRECADO: Migrado a ambutrack_core_datasource
  #   path: ../../packages/ambutrack_core
  ambutrack_core_datasource:
    path: ../../packages/ambutrack_core_datasource
  ambutrack_pdf:
    path: ../../packages/ambutrack_pdf

  # # Internacionalización (comentado temporalmente por conflicto con DS)
  # easy_localization: ^3.0.8

  nested: ^1.0.0
  excel: ^4.0.6
  sentry_flutter: ^10.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # TODO: Descomentar cuando se resuelva conflicto con freezed
  # bloc_test: ^10.0.0
  build_runner: ^2.16.1
  flutter_flavorizr: ^2.2.3
  flutter_lints: ^5.0.0
  freezed: ^4.0.3
  injectable_generator: ^3.1.3
  json_serializable: ^6.15.2
  # TODO: Descomentar cuando se resuelva conflicto con freezed
  # mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - lib/core/assets/
    - lib/core/lang/

# Override de dependencias para resolver conflictos
dependency_overrides:
  intl: ^0.20.2