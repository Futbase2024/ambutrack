name: ambutrack_mobile
description: AmbuTrack Mobile - App Android/iOS para personal de campo
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ===== CORE SHARED PACKAGE (Monorepo) =====
  # ambutrack_core:  # ⚠️ DEPRECADO - NO USAR
  #   path: ../../packages/ambutrack_core
  ambutrack_core_datasource:
    path: ../../packages/ambutrack_core_datasource

  # ===== STATE MANAGEMENT =====
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^2.1.0

  # ===== ROUTING =====
  go_router: ^14.8.1

  # ===== BACKEND =====
  supabase_flutter: ^2.18.3

  # ===== DEPENDENCY INJECTION =====
  get_it: ^9.3.0
  injectable: ^3.0.0

  # ===== CODE GENERATION =====
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # ===== OFFLINE STORAGE (Mobile Only) =====
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ===== LOCATION & PERMISSIONS (Mobile Only) =====
  geolocator: ^13.0.4
  permission_handler: ^11.4.0

  # ===== LOCAL NOTIFICATIONS (Mobile Only) =====
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

  # ===== UI =====
  cupertino_icons: ^1.0.9
  google_fonts: ^6.3.3

  # ===== MAPS (Mobile Only) =====
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # ===== UTILS =====
  intl: ^0.20.3
  uuid: ^4.6.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ===== LINTING =====
  flutter_lints: ^5.0.0

  # ===== CODE GENERATION =====
  build_runner: ^2.16.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  injectable_generator: ^3.1.3

  # ===== TESTING =====
  mocktail: ^1.0.5

  # ===== APP ICON GENERATION =====
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - lib/assets/images/
    - lib/assets/icons/

# ===== FLUTTER LAUNCHER ICONS CONFIGURATION =====
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/assets/images/icono_emertrack_full.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#00304D"

  # Android adaptive icon
  adaptive_icon_background: "#00304D"
  adaptive_icon_foreground: "lib/assets/images/icono_emertrack_full.png"
